<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florentino Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: #f7f0e8;
        --foreground: #2f241d;
        --muted: #6f6258;
        --surface: #fffdf9;
        --border: #e9dacc;
        --blush: #ecd4cb;
        --nude: #e6d9c9;
        --sand: #efe2ce;
        --accent: #c8926f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: var(--background);
        color: var(--foreground);
        line-height: 1.6;
      }
      a { color: inherit; text-decoration: none; }
      img { display: block; width: 100%; height: auto; }
      h1, h2, h3 { font-family: "Playfair Display", serif; margin: 0 0 0.75rem; line-height: 1.1; }
      .container { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; }
      .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
      .brand .brand-mark { color: inherit; margin-right: 0.2rem; font-weight: 600; font-size: 1em; line-height: 1; }
      .page { padding: 1.5rem 0 3rem; }
      .hero { background: linear-gradient(135deg, var(--blush), var(--nude)); border-radius: 1.5rem; padding: 2rem; margin-bottom: 1.5rem; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
      .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.25rem; overflow: hidden; }
      .product-card img { aspect-ratio: 4 / 5; object-fit: cover; }
      .product-body { padding: 1rem; }
      .selector-row { display: grid; gap: 0.45rem; margin: 0.6rem 0 0.8rem; }
      .selector-row label { display: grid; gap: 0.3rem; font-size: 0.9rem; color: var(--muted); }
      .option-group { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      .option-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: white;
        color: var(--foreground);
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
        cursor: pointer;
        user-select: none;
      }
      .option-pill.active { background: var(--foreground); color: white; border-color: var(--foreground); }
      .add-to-cart-btn { margin-top: 0.8rem; width: 100%; border: 0; border-radius: 999px; padding: 0.7rem 0.9rem; background: var(--foreground); color: white; font: inherit; font-weight: 600; cursor: pointer; }
      .cart-trigger {
        position: fixed; top: 1rem; right: 1rem; z-index: 45; display: inline-flex; align-items: center; justify-content: center; width: 2.8rem; height: 2.8rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--foreground); font-size: 1.05rem; cursor: pointer; box-shadow: 0 8px 20px rgba(47, 36, 29, 0.08);
      }
      .cart-count-pill { position: absolute; top: -0.3rem; right: -0.3rem; display: inline-flex; align-items: center; justify-content: center; min-width: 1.2rem; height: 1.2rem; padding: 0 0.26rem; border-radius: 999px; background: var(--accent); color: white; font-size: 0.72rem; font-weight: 700; }
      .cart-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(47, 36, 29, 0.32); }
      .cart-panel { position: fixed; top: 0; right: 0; z-index: 50; width: min(420px, 100vw); height: 100vh; padding: 1.2rem; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -12px 0 30px rgba(47, 36, 29, 0.12); transform: translateX(105%); transition: transform 220ms ease; overflow-y: auto; }
      .cart-panel.open { transform: translateX(0); }
      .cart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
      .cart-close { border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--foreground); }
      .cart-items { display: grid; gap: 0.75rem; margin-bottom: 1rem; }
      .cart-item { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.8rem; border: 1px solid var(--border); border-radius: 1rem; background: #fff; }
      .cart-item strong { display: block; margin-bottom: 0.2rem; }
      .cart-item small { color: var(--muted); }
      .cart-quantity { display: inline-flex; align-items: center; gap: 0.3rem; }
      .qty-btn { width: 1.8rem; height: 1.8rem; border: 1px solid var(--border); background: var(--background); border-radius: 999px; cursor: pointer; }
      .empty-cart { color: var(--muted); padding: 1rem 0; }
      .order-form { display: grid; gap: 0.75rem; }
      .order-form label { display: grid; gap: 0.35rem; color: var(--foreground); font-size: 0.95rem; }
      .order-form input, .order-form textarea { border: 1px solid var(--border); border-radius: 0.9rem; padding: 0.8rem 0.9rem; font: inherit; background: white; }
      .order-form textarea { resize: vertical; min-height: 5rem; }
      body.cart-open { overflow: hidden; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <button class="cart-trigger" id="cartTrigger" type="button" aria-label="Open cart">
      <span>🛍</span>
      <span class="cart-count-pill" id="cartCount">0</span>
    </button>
    <div class="cart-overlay" id="cartOverlay" hidden></div>
    <aside class="cart-panel" id="cartPanel" aria-hidden="true">
      <div class="cart-header">
        <div>
          <p class="badge">Your order</p>
          <h3>Shopping cart</h3>
        </div>
        <button class="cart-close" id="closeCart" type="button" aria-label="Close cart">×</button>
      </div>
      <div id="cartItems" class="cart-items"><p class="empty-cart">Your cart is empty.</p></div>
      <form id="orderForm" class="order-form">
        <label><span>Your name</span><input name="name" required /></label>
        <label><span>Phone number</span><input name="phone" required placeholder="+961 03 505664" /></label>
        <label><span>Delivery address</span><input name="address" placeholder="Optional" /></label>
        <label><span>Notes</span><textarea name="notes" rows="3" placeholder="Any details for your order?"></textarea></label>
        <button class="add-to-cart-btn" type="submit">Send order via WhatsApp</button>
      </form>
    </aside>

    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark">F</span>lorentino</a>
        <a href="index.html">← Back to home</a>
      </div>

      <section class="page">
        <div class="hero">
          <p class="badge">Collection</p>
          <h1 id="collectionTitle">Loading collection…</h1>
          <p id="collectionDescription">Please wait while we prepare the curated pieces.</p>
        </div>
        <div id="collectionGrid" class="grid"></div>
      </section>
    </div>

    <script>
      const collectionData = {
        dresses: {
          title: 'Dresses',
          description: 'Fluid silhouettes, elegant drape, and polished pieces for every occasion.',
          items: [
            { name: 'Rosé Chiffon Dress', price: '$89', image: 'src/assets/product-2.jpg' },
            { name: 'Silk Midi Dress', price: '$95', image: 'src/assets/product-3.jpg' },
            { name: 'Evening Bias Dress', price: '$110', image: 'src/assets/hero.jpg' }
          ]
        },
        knitwear: {
          title: 'Knitwear',
          description: 'Soft layers and effortless texture designed for comfort and style.',
          items: [
            { name: 'Bella Knit Sweater', price: '$68', image: 'src/assets/product-1.jpg' },
            { name: 'Cashmere Relax Knit', price: '$92', image: 'src/assets/product-4.jpg' },
            { name: 'Linen Knit Top', price: '$74', image: 'src/assets/product-5.jpg' }
          ]
        },
        tops: {
          title: 'Tops',
          description: 'Elegant essentials that pair beautifully with everything in your wardrobe.',
          items: [
            { name: 'Satin Blouse Ivory', price: '$54', image: 'src/assets/product-3.jpg' },
            { name: 'Pearl Shell Top', price: '$49', image: 'src/assets/product-6.jpg' },
            { name: 'Soft Rib Tank', price: '$42', image: 'src/assets/product-1.jpg' }
          ]
        },
        bottoms: {
          title: 'Bottoms',
          description: 'Tailored forms and graceful movement for a polished finish.',
          items: [
            { name: 'Cream Wide-Leg Trousers', price: '$72', image: 'src/assets/product-4.jpg' },
            { name: 'Silk Tailored Pants', price: '$78', image: 'src/assets/product-5.jpg' },
            { name: 'Soft Linen Skirt', price: '$58', image: 'src/assets/product-2.jpg' }
          ]
        },
        outerwear: {
          title: 'Outerwear',
          description: 'Layer with structure, softness, and quiet luxury.',
          items: [
            { name: 'Trench Coat', price: '$128', image: 'src/assets/product-6.jpg' },
            { name: 'Nude Wrap Coat', price: '$115', image: 'src/assets/product-1.jpg' },
            { name: 'Tailored Jacket', price: '$108', image: 'src/assets/product-4.jpg' }
          ]
        },
        accessories: {
          title: 'Accessories',
          description: 'The finishing touches that complete every look.',
          items: [
            { name: 'Silk Scarf', price: '$38', image: 'src/assets/product-5.jpg' },
            { name: 'Leather Tote', price: '$96', image: 'src/assets/product-6.jpg' },
            { name: 'Pearl Earrings', price: '$54', image: 'src/assets/product-3.jpg' }
          ]
        },
        outfits: {
          title: 'Outfits',
          description: 'Curated complete looks with matching pieces and effortless style.',
          items: [
            { name: 'Weekend Edit', price: '$145', image: 'src/assets/hero.jpg' },
            { name: 'Parisian Set', price: '$160', image: 'src/assets/product-2.jpg' },
            { name: 'Evening Ensemble', price: '$185', image: 'src/assets/product-1.jpg' }
          ]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const category = params.get('category') || 'dresses';
      const data = collectionData[category] || collectionData.dresses;
      document.getElementById('collectionTitle').textContent = data.title;
      document.getElementById('collectionDescription').textContent = data.description;
      const grid = document.getElementById('collectionGrid');
      grid.innerHTML = data.items.map((item) => `
        <article class="product-card">
          <img src="${item.image}" alt="${item.name}" />
          <div class="product-body">
            <h3>${item.name}</h3>
            <p>${item.price}</p>
            <div class="selector-row">
              <label>
                <span>Size</span>
                <div class="option-group" data-role="size">
                  <button class="option-pill" type="button" data-value="XS">XS</button>
                  <button class="option-pill" type="button" data-value="S">S</button>
                  <button class="option-pill" type="button" data-value="M">M</button>
                  <button class="option-pill" type="button" data-value="L">L</button>
                  <button class="option-pill" type="button" data-value="XL">XL</button>
                </div>
              </label>
              <label>
                <span>Color</span>
                <div class="option-group" data-role="color">
                  <button class="option-pill" type="button" data-value="Ivory">Ivory</button>
                  <button class="option-pill" type="button" data-value="Rose">Rose</button>
                  <button class="option-pill" type="button" data-value="Sand">Sand</button>
                  <button class="option-pill" type="button" data-value="Black">Black</button>
                  <button class="option-pill" type="button" data-value="Nude">Nude</button>
                </div>
              </label>
            </div>
            <button class="add-to-cart-btn" type="button" data-name="${item.name}" data-price="${item.price}">Add to cart</button>
          </div>
        </article>
      `).join('');

      const cartState = [];
      const cartTrigger = document.getElementById('cartTrigger');
      const cartOverlay = document.getElementById('cartOverlay');
      const cartPanel = document.getElementById('cartPanel');
      const closeCart = document.getElementById('closeCart');
      const cartCount = document.getElementById('cartCount');
      const cartItems = document.getElementById('cartItems');
      const orderForm = document.getElementById('orderForm');

      function openCart() { cartPanel.classList.add('open'); cartPanel.setAttribute('aria-hidden', 'false'); cartOverlay.hidden = false; document.body.classList.add('cart-open'); }
      function closeCartPanel() { cartPanel.classList.remove('open'); cartPanel.setAttribute('aria-hidden', 'true'); cartOverlay.hidden = true; document.body.classList.remove('cart-open'); }
      function renderCart() {
        const totalItems = cartState.reduce((sum, item) => sum + item.quantity, 0);
        cartCount.textContent = totalItems;
        if (!cartState.length) { cartItems.innerHTML = '<p class="empty-cart">Your cart is empty.</p>'; return; }
        cartItems.innerHTML = cartState.map((item, index) => `
          <div class="cart-item">
            <div><strong>${item.name}</strong><small>${item.price}</small></div>
            <div class="cart-quantity">
              <button class="qty-btn" type="button" data-action="decrease" data-index="${index}">−</button>
              <span>${item.quantity}</span>
              <button class="qty-btn" type="button" data-action="increase" data-index="${index}">+</button>
            </div>
          </div>
        `).join('');
        cartItems.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-index'));
            const action = button.getAttribute('data-action');
            if (action === 'increase') {
              cartState[index].quantity += 1;
            } else if (action === 'decrease') {
              if (cartState[index].quantity > 1) {
                cartState[index].quantity -= 1;
              } else {
                cartState.splice(index, 1);
              }
            }
            renderCart();
          });
        });
      }
      function addToCart(name, price, size, color) {
        if (!size || !color) {
          window.alert('Please select both a size and a color before adding this item to the cart.');
          return;
        }
        const existing = cartState.find((item) => item.name === name && item.size === size && item.color === color);
        if (existing) {
          existing.quantity += 1;
        } else {
          cartState.push({ name, price, size, color, quantity: 1 });
        }
        renderCart();
        openCart();
      }
      grid.querySelectorAll('.product-card').forEach((card) => {
        const button = card.querySelector('[data-name]');
        const sizeGroup = card.querySelector('[data-role="size"]');
        const colorGroup = card.querySelector('[data-role="color"]');

        sizeGroup?.querySelectorAll('.option-pill').forEach((pill) => {
          pill.addEventListener('click', () => {
            sizeGroup.querySelectorAll('.option-pill').forEach((item) => item.classList.remove('active'));
            pill.classList.add('active');
          });
        });

        colorGroup?.querySelectorAll('.option-pill').forEach((pill) => {
          pill.addEventListener('click', () => {
            colorGroup.querySelectorAll('.option-pill').forEach((item) => item.classList.remove('active'));
            pill.classList.add('active');
          });
        });

        button?.addEventListener('click', () => {
          const size = sizeGroup?.querySelector('.option-pill.active')?.getAttribute('data-value') || '';
          const color = colorGroup?.querySelector('.option-pill.active')?.getAttribute('data-value') || '';
          addToCart(button.getAttribute('data-name'), button.getAttribute('data-price'), size, color);
        });
      });
      cartTrigger?.addEventListener('click', openCart);
      closeCart?.addEventListener('click', closeCartPanel);
      cartOverlay?.addEventListener('click', closeCartPanel);
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeCartPanel(); });
      orderForm?.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!cartState.length) { window.alert('Please add at least one item to your cart first.'); return; }
        const formData = new FormData(orderForm);
        const customerName = String(formData.get('name') || '').trim();
        const phone = String(formData.get('phone') || '').trim();
        const address = String(formData.get('address') || '').trim();
        const notes = String(formData.get('notes') || '').trim();
        if (!customerName || !phone) { window.alert('Please add your name and phone number so we can contact you.'); return; }
        const itemsText = cartState.map((item) => `• ${item.quantity} × ${item.name} — ${item.price} | Size: ${item.size} | Color: ${item.color}`).join('\n');
        const message = `Hello Florentino! I would like to place an order.\n\nCustomer: ${customerName}\nPhone: ${phone}\nAddress: ${address || 'Not provided'}\nNotes: ${notes || 'No notes'}\n\nItems:\n${itemsText}`;
        window.open(`https://wa.me/96103505664?text=${encodeURIComponent(message)}`, '_blank', 'noopener,noreferrer');
        cartState.splice(0, cartState.length);
        renderCart();
        closeCartPanel();
        orderForm.reset();
      });
      renderCart();
    </script>
  </body>
</html>
